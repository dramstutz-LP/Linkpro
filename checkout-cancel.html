<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout Cancelled — LINK Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--charcoal:#1A1A1A;--cream:#F5F0EB;--gold:#C4A265;--muted:#8A8A8A;--serif:'Playfair Display',Georgia,serif;--sans:'Inter',sans-serif}
body{font-family:var(--sans);background:var(--cream);color:var(--charcoal);min-height:100vh;display:grid;place-items:center;padding:2rem}
.card{max-width:520px;width:100%;background:#fff;padding:3rem 2.5rem;border:1px solid rgba(0,0,0,.06);text-align:center}
h1{font-family:var(--serif);font-size:2rem;font-weight:500;margin-bottom:.75rem}
p{color:rgba(26,26,26,.6);line-height:1.7;margin-bottom:2rem}
a{display:inline-block;padding:14px 28px;background:var(--charcoal);color:#fff;font-size:.7rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;transition:background .3s;margin:0 .5rem .5rem 0}
a:hover{background:var(--gold);color:var(--charcoal)}
a.secondary{background:transparent;color:var(--charcoal);border:1px solid rgba(26,26,26,.2)}
a.secondary:hover{background:var(--charcoal);color:#fff}
</style>
</head>
<body>
<div class="card">
  <h1>Checkout cancelled</h1>
  <p>No charge was made. You can return to courses and try again whenever you’re ready.</p>
  <a href="courses.html">Back to courses</a>
  <a class="secondary" id="retry-link" href="courses.html">Try again</a>
</div>
<script>
(function () {
  var product = new URLSearchParams(window.location.search).get('product');
  if (product) {
    document.getElementById('retry-link').href = 'courses.html#' + (product === 'seminar-upper-limb' ? 'seminars' : 'online');
  }
})();
</script>
</body>
</html>
